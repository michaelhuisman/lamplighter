# Dev environment. Requires first: scripts/dev-keys.sh
#   podman compose -f compose.dev.yml up -d --build
#   podman compose -f compose.dev.yml run --rm dev pytest tests/integration

name: lamplighter # containers and volumes: lamplighter-<service>, lamplighter_<volume>

x-app: &app
  image: localhost/lamplighter:dev
  build:
    context: .
    target: dev
  environment: &app-env
    LAMPLIGHTER_DATABASE_URL: postgresql+psycopg://lamplighter:lamplighter@postgres:5432/lamplighter
    LAMPLIGHTER_LOG_LEVEL: INFO
    LAMPLIGHTER_PUBLIC_URL: http://localhost:8000
    # Dev runs over http; in production this stays true.
    LAMPLIGHTER_SESSION_COOKIE_SECURE: "false"
  # Source code mounted: after a code change a restart is enough (no rebuild).
  volumes:
    - ./app:/app/app:ro
    - ./migrations:/app/migrations:ro
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: docker.io/library/postgres:18.6
    # A frozen (not crashed) leader loses its advisory lock within ~15s.
    command:
      - postgres
      - -c
      - tcp_keepalives_idle=5
      - -c
      - tcp_keepalives_interval=5
      - -c
      - tcp_keepalives_count=2
    environment:
      POSTGRES_USER: lamplighter
      POSTGRES_PASSWORD: lamplighter # dev only
      POSTGRES_DB: lamplighter
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lamplighter -d lamplighter"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *app
    command: ["migrate"]
    restart: "no"

  api:
    <<: *app
    command: ["api"]
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      <<: *app-env
      # The browser uses localhost:8080 (issuer, login), the api the internal address.
      LAMPLIGHTER_OIDC_ISSUER: http://localhost:8080/realms/lamplighter
      LAMPLIGHTER_OIDC_DISCOVERY_URL: http://keycloak:8080/realms/lamplighter/.well-known/openid-configuration
      LAMPLIGHTER_OIDC_CLIENT_ID: lamplighter
    env_file:
      - .dev/secrets/oidc.env # LAMPLIGHTER_OIDC_CLIENT_SECRET, from scripts/dev-keys.sh
      - .dev/secrets/metrics.env # LAMPLIGHTER_METRICS_TOKEN
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Dev only. Realm, clients and test users from .dev/keycloak (scripts/dev-keys.sh).
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HOSTNAME: http://localhost:8080
      # Token and JWKS endpoints follow the requester's address (keycloak:8080).
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    env_file:
      - .dev/secrets/keycloak.env
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./.dev/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 40

  # Run with --scale scheduler=2 to test leader election.
  scheduler:
    <<: *app
    command: ["scheduler"]
    environment:
      <<: *app-env
      LAMPLIGHTER_OPENBAO_ADDR: http://openbao:8200
      LAMPLIGHTER_WEBHOOK_OPENBAO_PATH: webhooks/default
      LAMPLIGHTER_WEBHOOK_CACHE_S: "5" # short in dev, so the rotation test is fast
      # Short in dev, so the reaper test is fast.
      LAMPLIGHTER_REAPER_INTERVAL_S: "5"
      LAMPLIGHTER_REAPER_GRACE_S: "10"
    env_file:
      - .dev/secrets/openbao/scheduler.env # AppRole lamplighter-scheduler
    depends_on:
      migrate:
        condition: service_completed_successfully
      openbao-init:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ["worker"]
    stop_grace_period: 60s
    # One SELinux level for all workers (and `dev`): files one worker writes into the
    # shared caches stay readable for the others. Ignored without SELinux.
    security_opt:
      - label=level:s0:c401,c402
    environment:
      <<: *app-env
      LAMPLIGHTER_OPENBAO_ADDR: http://openbao:8200
      LAMPLIGHTER_ANSIBLE_HOST_KEY_CHECKING: "false"
      LAMPLIGHTER_POLL_INTERVAL_S: "1"
      # The fixture repo was created by another container.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
    env_file:
      - .dev/secrets/openbao/worker.env # AppRole lamplighter-worker
    volumes:
      - ./app:/app/app:ro
      - ./migrations:/app/migrations:ro
      - runtime:/run/lamplighter
      - repocache:/var/cache/lamplighter/repos
      - collections:/var/cache/lamplighter/collections
      - fixtures:/fixtures:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      fixture-repo:
        condition: service_completed_successfully
      openbao-init:
        condition: service_completed_successfully
      git-http:
        condition: service_started
      ssh-target:
        condition: service_started

  # Dev only: in-memory OpenBao. Its content comes from openbao-init (dev/openbao/init.sh).
  openbao:
    image: quay.io/openbao/openbao:2.7.1
    command: ["server", "-dev", "-dev-listen-address=0.0.0.0:8200"]
    env_file:
      - .dev/secrets/openbao/server.env # root token, dev only
    healthcheck:
      test: ["CMD", "bao", "status", "-address=http://127.0.0.1:8200"]
      interval: 2s
      timeout: 3s
      retries: 30

  openbao-init:
    image: quay.io/openbao/openbao:2.7.1
    entrypoint: ["sh", "/init/init.sh"]
    env_file:
      - .dev/secrets/openbao/init.env
    volumes:
      - ./dev/openbao:/init:ro
      - ./.dev/secrets:/secrets:ro
    depends_on:
      openbao:
        condition: service_healthy
    restart: "no"

  # Git over http with basic auth (read-only) for projects with a git_token.
  git-http:
    <<: *app
    entrypoint: ["python", "/srv/server.py"]
    command: []
    volumes:
      - ./dev/git-http:/srv:ro
      - ./.dev/secrets/git:/secrets/git:ro
      - fixtures:/fixtures:ro
    depends_on:
      fixture-repo:
        condition: service_completed_successfully

  # Builds the bare git repos from tests/fixtures in the fixtures volume (repo.git,
  # collections.git, collections-bad.git; see scripts/build-fixtures.sh).
  fixture-repo:
    <<: *app
    depends_on: {}
    entrypoint: ["sh", "/src/scripts/build-fixtures.sh", "/src/tests/fixtures", "/fixtures"]
    volumes:
      - fixtures:/fixtures
      - ./scripts:/src/scripts:ro
      - ./tests/fixtures:/src/tests/fixtures:ro
    restart: "no"

  ssh-target:
    build:
      context: dev/ssh-target
    volumes:
      - ./.dev/secrets/ssh-target/id_ed25519.pub:/authorized_keys:ro
      - ./.dev/secrets/ssh-target/host_ed25519_key:/host_key:ro
      - ./.dev/secrets/ssh-target/host_ed25519_key.pub:/host_key.pub:ro

  # Receives webhooks; tests read /received and can force failures via /fail.
  webhook-sink:
    image: docker.io/library/python:3.12-slim
    command: ["python", "/sink/server.py"]
    volumes:
      - ./dev/webhook-sink:/sink:ro

  # Tooling and tests: podman compose -f compose.dev.yml run --rm dev <cmd>
  dev:
    <<: *app
    profiles: ["tools"]
    security_opt:
      - label=level:s0:c401,c402
    user: "0"
    command: ["bash"]
    entrypoint: []
    working_dir: /src
    environment:
      <<: *app-env
      LAMPLIGHTER_IT_API_URL: http://api:8000
      LAMPLIGHTER_IT_WEBHOOK_SINK: http://webhook-sink:8080
      LAMPLIGHTER_IT_KEYCLOAK: http://keycloak:8080
      LAMPLIGHTER_IT_OPENBAO: http://openbao:8200
      LAMPLIGHTER_IT_GIT_HTTP: http://git-http:8080
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
    volumes:
      - .:/src
      - runtime:/run/lamplighter:ro
      - repocache:/var/cache/lamplighter/repos:ro
      - collections:/var/cache/lamplighter/collections:ro
      - fixtures:/fixtures:ro
      - ./.dev/secrets:/secrets:ro

volumes:
  pgdata:
  fixtures:
  # Shared between workers (flock per project) and read-only with `dev` for the tests.
  repocache:
  # Installed collections per requirements set, shared between workers (flock per set).
  collections:
  # tmpfs, shared between workers (and read-only with `dev` for the cleanup tests).
  runtime:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=512m,uid=10001,gid=10001,mode=0700"
