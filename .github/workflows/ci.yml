# CI: lint, unit, integration (against compose.dev.yml with Docker), the Ansible role
# (deploy-test on the runner), a Trivy scan of the runtime image and the image to GHCR.
# Actions are pinned to a commit SHA; the tag follows as a comment.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  IMAGE: ghcr.io/${{ github.repository_owner }}/lamplighter
  # Pinned by digest (multi-arch index of 0.76.0).
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app

  lint-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: deploy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: deploy/requirements.txt
      - run: pip install -r requirements.txt
      - run: ansible-galaxy collection install -r requirements.yml
      - run: ansible-lint
      - run: ansible-playbook --syntax-check -i tests/inventory.yml site.yml restore.yml

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/unit -q

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CONTAINER: docker
      COMPOSE: docker compose -f compose.dev.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate dev secrets (for this runner only)
        run: ./scripts/dev-keys.sh
      - name: Start the stack
        run: $COMPOSE up -d --build --scale worker=2 --scale scheduler=2
      - name: Wait for keycloak and api
        run: |
          for i in $(seq 1 90); do
            kc=$(docker inspect lamplighter-keycloak-1 --format '{{.State.Health.Status}}' 2>/dev/null || true)
            if [ "$kc" = healthy ] && curl -sf http://127.0.0.1:8000/readyz >/dev/null; then
              echo "stack ready after $((i * 3))s"; exit 0
            fi
            sleep 3
          done
          $COMPOSE ps -a
          exit 1
      - name: Integration tests
        run: $COMPOSE run --rm dev pytest tests/integration -m "not slow" -q -rfs
      - name: Slow tests (real cron firings)
        run: $COMPOSE run --rm dev pytest tests/integration -m slow -q -rfs
      - name: Failover (kill the scheduler leader)
        run: ./scripts/it-failover.sh
      - name: Secret scan of the container logs
        run: ./scripts/it-secret-scan.sh
      - name: Container logs on failure
        if: failure()
        run: $COMPOSE logs --no-color > compose-logs.txt 2>&1 || true
      - name: Keep logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compose-logs
          path: compose-logs.txt
          retention-days: 7

  deploy:
    # The Ansible role against the (ephemeral) runner: install, idempotence, an image
    # update during a running run, backup and restore. See deploy/tests/deploy-test.sh.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      FIXTURES: docker compose -p lamplighter-fixtures -f compose.dev.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: deploy/requirements.txt
      - name: Install Ansible
        run: |
          pip install -r deploy/requirements.txt
          ansible-galaxy collection install -r deploy/requirements.yml
      - name: Generate dev secrets (for this runner only)
        run: ./scripts/dev-keys.sh
      - name: Build the runtime image
        run: docker build --target runtime -t localhost/lamplighter:ci .
      - name: Start the test fixtures (OpenBao, ssh-target, git-http)
        run: |
          $FIXTURES up -d --build openbao ssh-target git-http
          $FIXTURES run --rm openbao-init
      - name: Deploy test
        run: ./deploy/tests/deploy-test.sh
      - name: Logs on failure
        if: failure()
        run: |
          sudo docker compose -f /opt/lamplighter/compose.yml logs --no-color > deploy-logs.txt 2>&1 || true
          $FIXTURES logs --no-color >> deploy-logs.txt 2>&1 || true
          sudo journalctl -u lamplighter-backup.service --no-pager >> deploy-logs.txt 2>&1 || true
      - name: Keep logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deploy-logs
          path: deploy-logs.txt
          retention-days: 7

  scan:
    # Trivy on the runtime image: fails on fixable HIGH/CRITICAL vulnerabilities (accepted
    # exceptions go in .trivyignore, with a reason). All findings go to the Security tab.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the runtime image
        run: docker build --target runtime -t localhost/lamplighter:scan .
      - name: Trivy report (all severities, SARIF)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/src" \
            -v trivy-cache:/root/.cache "$TRIVY_IMAGE" image --scanners vuln \
            --format sarif --output /src/trivy.sarif localhost/lamplighter:scan
      - name: Upload to the Security tab
        if: always() && github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy.sarif
          category: trivy-image
      - name: Trivy gate (fixable HIGH/CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/src" \
            -v trivy-cache:/root/.cache "$TRIVY_IMAGE" image --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --ignorefile /src/.trivyignore \
            --exit-code 1 localhost/lamplighter:scan

  image:
    # Only after green tests, and only for main and version tags (not for PRs).
    needs: [lint, lint-deploy, unit, integration, deploy, scan]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=lamplighter
            org.opencontainers.image.description=Runs Ansible playbooks on a schedule and on demand
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
